# Wydanie straznika: tag `vX.Y.Z`
#   -> obraz ghcr.io/deiflagellum/sigelith-cosigner (amd64 + arm64), podpisany
#      cosign keyless (OIDC GitHub Actions), z SBOM i provenance;
#   -> paczka dla AWS Lambda (provided.al2023, arm64) w wydaniu na GitHubie,
#      z sumą SHA-256.
#
# To repo jest PUBLICZNE celowo: operator (i AWS) uruchamia program, ktory
# kazdy moze przeczytac, odbudowac i porownac z wydaniem.
#
# PO PIERWSZYM WYDANIU: GitHub -> Packages -> sigelith-cosigner -> Package
# settings -> Change visibility -> Public (inaczej operator nie pobierze obrazu).
#
# Weryfikacja przez operatora:
#   cosign verify ghcr.io/deiflagellum/sigelith-cosigner:X.Y.Z \
#     --certificate-identity-regexp 'github.com/DeiFlagellum/sigelith-cosigner' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write    # wydanie z paczka Lambdy
  packages: write
  id-token: write    # cosign keyless

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push-sign:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/deiflagellum/sigelith-cosigner
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.full == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.full == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.full == 'true' }}
          labels: |
            org.opencontainers.image.title=sigelith-cosigner
            org.opencontainers.image.description=Sigelith log cosigner — independent witness that cosigns the public Sigelith log every minute

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64

      - uses: sigstore/cosign-installer@v3

      - name: Podpisz obraz (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/deiflagellum/sigelith-cosigner@${DIGEST}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Paczka dla AWS Lambda (arm64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -buildid= -X main.version=${{ steps.ver.outputs.version }}" -o dist/bootstrap .
          GOOS= GOARCH= go run ./tools/lambdazip dist/bootstrap dist/sigelith-cosigner-lambda-arm64.zip | tee dist/SHA256SUMS

      - name: Wydanie na GitHubie
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Obraz (po digescie):"
            echo
            echo '```yaml'
            echo "image: ghcr.io/deiflagellum/sigelith-cosigner@${DIGEST}"
            echo '```'
            echo
            echo "Paczka dla AWS Lambda (provided.al2023, arm64):"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/sigelith-cosigner-lambda-arm64.zip dist/SHA256SUMS \
            --title "sigelith-cosigner ${{ steps.ver.outputs.version }}" --notes-file dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"
